<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napi Terv és Eredmény Kalkulátor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background-color: #f9f9f9; color: #333; }
        header {
            background-color: #fff;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header img {
            height: 50px;
        }
        h2 {
            color: #007BFF;
            font-size: 28px;
            margin: 20px 0;
            text-align: center;
        }
        #date { font-size: 18px; text-align: center; margin-bottom: 20px; }
        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
            background: white;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        th {
            background-color: #007BFF;
            color: white;
            padding: 15px;
            font-size: 18px;
        }
        td {
            border: 1px solid #ddd;
            padding: 15px;
            font-size: 18px;
        }
        input, textarea, select {
            font-size: 16px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        input[type="number"] {
            width: 100px;
            text-align: center;
        }
        .wide-cell {
            font-weight: bold;
            font-size: 22px;
            width: 150px;
        }
        h3 {
            font-size: 20px;
            margin: 30px 0 10px;
            text-align: center;
        }
        .positive { background-color: #d4edda; }
        .negative { background-color: #f8d7da; }
        .total-row td {
            font-weight: bold;
            font-size: 22px;
            background-color: #f1f1f1;
        }
        .input-group {
            width: 80%;
            margin: 10px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        #comments {
            font-size: 24px;
            width: 80%;
            margin: 20px auto;
            display: block;
        }
    </style>
    <script>
        function calculateValues() {
            let plan8k = parseInt(document.getElementById('plan-8k').value) || 0;
            let plan12k = parseInt(document.getElementById('plan-12k').value) || 0;
            let act8k = parseInt(document.getElementById('act-8k').value) || 0;
            let act12k = parseInt(document.getElementById('act-12k').value) || 0;
            let ticket8k = parseInt(document.getElementById('ticket-8k').innerText) || 0;
            let ticket12k = parseInt(document.getElementById('ticket-12k').innerText) || 0;

            let totalPlan = plan8k + plan12k;
            let totalAct = act8k + act12k;
            let totalTicket = ticket8k + ticket12k;

            document.getElementById('ticket-total').innerText = totalTicket;
            document.getElementById('plan-total').innerText = totalPlan;
            document.getElementById('act-total').innerText = totalAct;

            updateCell('act-vs-plan-8k', act8k - plan8k);
            updateCell('act-vs-plan-12k', act12k - plan12k);
            updateCell('act-vs-plan-total', totalAct - totalPlan);

            updateCell('act-vs-ticket-8k', act8k - ticket8k);
            updateCell('act-vs-ticket-12k', act12k - ticket12k);
            updateCell('act-vs-ticket-total', totalAct - totalTicket);
        }

        function updateCell(id, value) {
            let cell = document.getElementById(id);
            cell.innerText = value;
            cell.className = "wide-cell";
            if (value < 0) {
                cell.classList.add('negative');
            } else if (value > 0) {
                cell.classList.add('positive');
            }
        }

        function setCurrentDate() {
            let today = new Date();
            today.setDate(today.getDate() - 1);
            document.getElementById("date").innerText = "Dátum: " + today.toLocaleDateString("hu-HU");
        }

        function updateStatusColor() {
            let statusInput = document.getElementById("monthly-status");
            let statusColor = document.getElementById("status-color").value;

            if (statusColor === "zöld") {
                statusInput.style.backgroundColor = "#d4edda";
            } else if (statusColor === "piros") {
                statusInput.style.backgroundColor = "#f8d7da";
            } else {
                statusInput.style.backgroundColor = "white";
            }
        }
    </script>
</head>
<body onload="setCurrentDate()">
    <header>
        <img src="image.png" alt="Bridgestone logo">
    </header>
    <h2>Napi Terv és Eredmény Kalkulátor</h2>
    <p id="date"></p>
    <table>
        <tr>
            <th>Terület</th>
            <th>TICKET (db)</th>
            <th>Terv (db)</th>
            <th>ACT (db)</th>
            <th class="wide-cell">ACT vs Terv (db)</th>
            <th class="wide-cell">ACT vs Ticket (db)</th>
        </tr>
        <tr>
            <td>8k Curing</td>
            <td id="ticket-8k">3567</td>
            <td><input type="number" id="plan-8k" oninput="calculateValues()"></td>
            <td><input type="number" id="act-8k" oninput="calculateValues()"></td>
            <td id="act-vs-plan-8k" class="wide-cell">0</td>
            <td id="act-vs-ticket-8k" class="wide-cell">0</td>
        </tr>
        <tr>
            <td>12k Curing</td>
            <td id="ticket-12k">8906</td>
            <td><input type="number" id="plan-12k" oninput="calculateValues()"></td>
            <td><input type="number" id="act-12k" oninput="calculateValues()"></td>
            <td id="act-vs-plan-12k" class="wide-cell">0</td>
            <td id="act-vs-ticket-12k" class="wide-cell">0</td>
        </tr>
        <tr class="total-row">
            <td><b>TOTAL Curing</b></td>
            <td id="ticket-total">0</td>
            <td id="plan-total">0</td>
            <td id="act-total">0</td>
            <td id="act-vs-plan-total" class="wide-cell">0</td>
            <td id="act-vs-ticket-total" class="wide-cell">0</td>
        </tr>
    </table>

    <h3>FI Stock</h3>
    <div class="input-group">
        <input type="number" id="fi-stock">
    </div>

    <h3>Havi Státusz</h3>
    <div class="input-group">
        <input type="number" id="monthly-status">
        <select id="status-color" onchange="updateStatusColor()">
            <option value="">Szín választása</option>
            <option value="zöld">Zöld</option>
            <option value="piros">Piros</option>
        </select>
    </div>

    <h3>Főbb Elmaradások</h3>
    <textarea id="comments" rows="4" cols="50"></textarea>
</body>
</html>
